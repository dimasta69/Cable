name: CICD

on:
  push:
    branches:
      - testing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout  
        uses: actions/checkout@v3
      - name: Run command and remote server
        uses: webfactory/ssh-agent@v0.5.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          # host_fingerprint: ${{ secrets.HOST_FINGERPRINT }}
          command: 
            echo '--- START WORK ON REMOTE SERVER ---';
            cd ${{ secrets.PROJECT_FOLDER }};
            echo '--- LIST OF FILES ---';
            git checkout testing;
            git pull;
            cp .env-example .env;
            ls -a;
            echo '--- RESTARTING AND REBUILDING CONTAINER web ---';
            docker-compose up -d --build web; 
            echo '--- LIST OF DOCKER CONTAINERS AFTER RESTARTING web CONTAINER ---';
            docker ps;