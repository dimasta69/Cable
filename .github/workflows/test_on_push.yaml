name: CICD

on:
  push:
    branches:
      - testing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout  
        uses: actions/checkout@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo 4546 

      - name: Deploy code
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          PROJECT_FOLDER: ${{ secrets.PROJECT_FOLDER }}
        run: |
          echo '--- SSH CONNECTION ---'
          # Создаем временный файл для ключа
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key
          ls -l private_key
   

          # Подключаемся к удаленному серверу
          # ssh -vvv -i ~/.ssh/private_key -o StrictHostKeyChecking=no root@45.10.110.191 << EOF
          ssh -T -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@45.10.110.191 << EOF
            echo '--- START WORK ON REMOTE SERVER ---'
            cd "$PROJECT_FOLDER" || exit
            echo '--- LIST OF FILES ---'
            ls -la
            echo '--- GIT ---'
            git checkout testing
            git pull
            cp .env-example .env
            echo '--- RESTARTING AND REBUILDING CONTAINER web ---'
            docker-compose up -d --build web
            echo '--- LIST OF DOCKER CONTAINERS AFTER RESTARTING web CONTAINER ---'
            docker ps -a
          EOF

          # Удаляем временный файл с ключом
          rm private_key

