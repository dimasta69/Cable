upstream backend {
    server web:8000;
}

upstream frontend {
    server front:5173;
}

server {
    server_name 94.131.107.85;
    client_max_body_size 100m;

    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript;

    access_log /var/log/nginx/cabel.access.log;
    error_log /var/log/nginx/pt-cabel.error.log;

    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Ssl on;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-Start "t=${msec}";
    proxy_redirect off;
    proxy_read_timeout 300;
    proxy_buffer_size 16k;
    proxy_buffers 32 16k;

    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With';
    add_header 'Access-Control-Max-Age' 86400;

    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With';
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }
        try_files $uri @frontend;
    }

    location ~* ^/index.html {
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
        root /var/www/cs/current/startup/_static/;
        try_files $uri @backend;
    }

    location @frontend {
        proxy_pass http://frontend;
        proxy_http_version 1.1;  
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade"; 
    }

    location @backend {
        proxy_pass http://backend;
    }

    location ~* ^/src/ {
        alias /var/www/cs/current/startup/src/;
        try_files $uri @frontend;
    }

    location ~* ^/public/ {
        alias /var/www/cs/current/startup/public/;
        try_files $uri @frontend;
    }

    location ~* /node_modules/ {
        proxy_pass http://frontend; 
    }

    location ~* ^/(static|uploads|media) {
        alias /var/www/ss/current/Cable/static/;
        try_files $uri @backend;
    }

    location ~* ^/(admin|.*_api) {
        root /var/www/ss/current/Cable/;
        try_files $uri @backend;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        root /var/www/cs/current/startup/public/;
        try_files $uri @backend;
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    location = /journaling.ico {
        root /var/www/cs/current/startup/public/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public";
    }
}
