upstream backend {
    server web:8000;
}

upstream frontend {
    server front:3000;
}

server {
    server_name 94.131.107.85;
    client_max_body_size 100m;

    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript;

    access_log /var/log/nginx/cabel.access.log;
    error_log /var/log/nginx/pt-cabel.error.log;

    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Ssl on;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-Start "t=${msec}";
    proxy_redirect off;
    proxy_read_timeout 300;
    proxy_buffer_size 16k;
    proxy_buffers 32 16k;

    location ^~ /build/static {
        alias /front/build/static/;
        add_header Cache-Control "public, max-age=3600, immutable";
    }

    location @frontend {
        proxy_pass http://frontend;
    }

    location @backend {
        proxy_pass http://backend;
    }

    location / {
        try_files $uri @frontend;
        add_header Cache-Control "no-cache";
    }

    location ^~ /api/addresses {
        proxy_pass http://frontend;
    }

    location ~* ^/(admin|.*_api) {
        try_files $uri @backend;
    }

    location ~* ^/(static|uploads|media) {
        alias /app/static;
        try_files $uri @backend;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        alias /front/build;
        try_files $uri @backend;
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
    }
}