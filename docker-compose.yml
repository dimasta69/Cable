services:
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_dump:/var/lib/postgresql/data
    ports:
      - "5435:5432"


  web:
    build:
      context: .
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      DEBUG: "True"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      DB_HOST: ${DB_HOST}
    volumes:
      - static_volume:/app/static

  nginx:
    image: nginx:latest
    container_name: nginx
    depends_on:
      - web
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf
      - ./conf/cabel.conf:/etc/nginx/conf.d/cabel.conf
      - static_volume:/app/static
    ports:
      - "80:80"
volumes:
  static_volume:
  pg_dump:
