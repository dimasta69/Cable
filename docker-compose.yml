services:
  postgres:
    image: postgres:latest
    ports:
      - "5435:5432"
    networks:
      - app-network

  web:
    build:
      context: .
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      DEBUG: "True"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      DB_HOST: ${DB_HOST}
      API_URL: "http://web:8000"
    volumes:
      - static_volume:/app/cabel/static
    networks:
      - app-network

  front:
    build:
      context: /var/www/cs/current/startup/
    depends_on:
      - web
    ports:
      - "3000:3000"
    environment: 
      REACT_APP_API_URL: "http://web:8000"
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx
    depends_on:
      - front
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf
      - ./conf/cabel.conf:/etc/nginx/conf.d/cabel.conf
      - static_volume:/app/cabel/static
    ports:
      - "80:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  static_volume:
  pg_dump: