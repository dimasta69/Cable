services:
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_dump:/var/lib/postgresql/data
    ports:
      - "5435:5432"


  web:
    build:
      context: .
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      DEBUG: "True"
    volumes:
      - static_volume:/app/static
volumes:
  static_volume:
  pg_dump: